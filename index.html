  <style>

      --violet: #8b80e8; --violetb: rgba(139,128,232,0.14);
      --gold: #c8901a; --teal: #1ea07a; --coral: #d85a30; --rose: #c0516a;
      --sans: 'Inter', system-ui, sans-serif;
      --serif: 'Playfair Display', Georgia, serif;
      --mono: 'JetBrains Mono', monospace;
      --max: 1200px;
    }
    
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: var(--sans); background: var(--ink); color: var(--bright); line-height: 1.7; -webkit-font-smoothing: antialiased; }
    a { color: var(--violet); text-decoration: none; }
    a:hover { text-decoration: underline; }
    
    .nav { position: sticky; top: 0; z-index: 200; background: rgba(14,14,16,0.92); backdrop-filter: blur(16px); border-bottom: 1px solid var(--rim); padding: 0 1.5rem; height: 52px; display: flex; align-items: center; }
    .nav-brand { font-family: var(--serif); color: var(--white); }
    .nav-sub { font-family: var(--mono); font-size: 0.6rem; color: var(--dim); margin-left: 0.5rem; }
    
    .hero { max-width: var(--max); margin: 0 auto; padding: 3rem 1.5rem 2rem; border-bottom: 1px solid var(--rim); }
    .hero-title { font-family: var(--serif); font-size: clamp(2rem, 5vw, 3.6rem); color: var(--white); line-height: 1.1; margin-bottom: 1rem; }
    .hero-lede { color: var(--mid); max-width: 65ch; margin-bottom: 1.5rem; }
    
    .hero-stats { display: flex; gap: 0.75rem; flex-wrap: wrap; font-family: var(--mono); font-size: 0.65rem; color: var(--bright); }
    .stat-chip { background: var(--ink2); border: 1px solid var(--rim); padding: 0.25rem 0.75rem; border-radius: 20px; }
    .stat-chip strong { color: var(--violet); }

    .controls { max-width: var(--max); margin: 0 auto; padding: 1.5rem 1.5rem; display: flex; flex-direction: column; gap: 1rem; }
    .search-box { width: 100%; max-width: 400px; background: var(--ink2); border: 1px solid var(--rim2); color: var(--white); padding: 0.6rem 1rem; border-radius: 6px; font-family: var(--mono); font-size: 0.8rem; outline: none; }
    .search-box:focus { border-color: var(--violet); }
    
    .filters { display: flex; gap: 0.5rem; flex-wrap: wrap; font-family: var(--mono); font-size: 0.6rem; }
    .filter-btn { background: var(--ink2); border: 1px solid var(--rim); color: var(--mid); padding: 0.25rem 0.75rem; border-radius: 20px; cursor: pointer; text-transform: uppercase; }
    .filter-btn.active { background: var(--violetb); border-color: var(--violet); color: var(--violet); }

    .table-wrap { max-width: var(--max); margin: 0 auto; padding: 0 1.5rem 4rem; overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-family: var(--mono); font-size: 0.75rem; }
    th { text-align: left; padding: 0.75rem; color: var(--dim); border-bottom: 2px solid var(--rim2); cursor: pointer; user-select: none; }
    th:hover { color: var(--white); }
    td { padding: 0.6rem 0.75rem; border-bottom: 1px solid var(--rim); vertical-align: middle; }
    tr:hover { background: var(--smoke); }
    
    .badge { padding: 0.15rem 0.4rem; border-radius: 4px; font-size: 0.6rem; text-transform: uppercase; letter-spacing: 0.05em; }
    .badge-pub { background: rgba(30,160,122,0.15); color: var(--teal); border: 1px solid var(--teal); }
    .badge-priv { background: rgba(192,81,106,0.15); color: var(--rose); border: 1px solid var(--rose); }
    .badge-fork { background: var(--rim); color: var(--dim); }
    
    .dim { color: var(--dim); font-size: 0.65rem; }
  </style>
</head>

<nav class="nav">

}

// 3. UI RENDERING LOGIC
// ============================================================================

function calculateTimeAgo(dateString) {
  if (!dateString) return 'Never';
  const seconds = Math.floor((new Date() - new Date(dateString)) / 1000);
  let interval = seconds / 31536000;
  if (interval > 1) return Math.floor(interval) + " yr ago";
  interval = seconds / 2592000;
  if (interval > 1) return Math.floor(interval) + " mo ago";
  interval = seconds / 86400;
  if (interval > 1) return Math.floor(interval) + " d ago";
  interval = seconds / 3600;
  if (interval > 1) return Math.floor(interval) + " hr ago";
  return "Just now";
}

function renderStats() {
  const total = allRepos.length;
  const privateCount = allRepos.filter(r => r.private).length;
  const publicCount = total - privateCount;
  const forks = allRepos.filter(r => r.is_fork).length;
  const totalMb = (allRepos.reduce((sum, r) => sum + (r.size_kb || 0), 0) / 1024).toFixed(1);

  document.getElementById('global-stats').innerHTML = `
    <span class="stat-chip">Total Repos: <strong>${total}</strong></span>
    <span class="stat-chip">Public: <strong>${publicCount}</strong></span>
    <span class="stat-chip">Private: <strong>${privateCount}</strong></span>
    <span class="stat-chip">Forks: <strong>${forks}</strong></span>
    <span class="stat-chip">Total Size: <strong>${totalMb} MB</strong></span>
  `;
}

function renderFilters() {
  const filterContainer = document.getElementById('account-filters');
  const accounts = Object.keys(rawData);
  
  accounts.forEach(acc => {
    const btn = document.createElement('button');
    btn.className = 'filter-btn';
    btn.setAttribute('data-account', acc);
    btn.innerText = acc;
    filterContainer.appendChild(btn);
  });

  // Attach event listeners to all filter buttons
  document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      e.target.classList.add('active');
      currentFilter = e.target.getAttribute('data-account');
      renderTable();
    });
  });
}

function renderTable() {
  const tbody = document.getElementById('table-body');
  tbody.innerHTML = ''; // Clear current

  // 1. Filter
  let data = allRepos.filter(r => {
    const matchAcct = currentFilter === 'all' || r.account === currentFilter;
    const matchQuery = !currentSearch || 
      (r.name + ' ' + r.account + ' ' + (r.language || '')).toLowerCase().includes(currentSearch);
    return matchAcct && matchQuery;
  });

  // 2. Sort
  data.sort((a, b) => {
    let valA = a[currentSort.col];
    let valB = b[currentSort.col];
    
    // Handle nulls for dates/languages
    if (valA === null) valA = '';
    if (valB === null) valB = '';

    if (typeof valA === 'string') {
      return valA.localeCompare(valB) * currentSort.dir;
    }
    return (valA - valB) * currentSort.dir;
  });

  // 3. Render HTML
  data.forEach(r => {
    const isPriv = r.private ? '<span class="badge badge-priv">Private</span>' : '<span class="badge badge-pub">Public</span>';
    const isFork = r.is_fork ? '<span class="badge badge-fork">Fork</span>' : '';
    const lang = r.language || '<span class="dim">—</span>';
    const size = r.size_kb ? r.size_kb.toLocaleString() : '0';
    const age = calculateTimeAgo(r.last_pushed);

    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td style="color:var(--white);">${r.account}</td>
      <td><a href="https://github.com/${r.account}/${r.name}" target="_blank">${r.name}</a> ${isFork}</td>
      <td>${lang}</td>
      <td style="text-align:right;" class="dim">${size}</td>
      <td class="dim" title="${r.last_pushed}">${age}</td>
      <td>${isPriv}</td>
    `;
    tbody.appendChild(tr);
  });
}

// ============================================================================
// 4. EVENT LISTENERS
// ============================================================================

document.getElementById('search').addEventListener('input', (e) => {
  currentSearch = e.target.value.toLowerCase();
  renderTable();
});

document.querySelectorAll('th[data-sort]').forEach(th => {
  th.addEventListener('click', (e) => {
    const col = e.target.getAttribute('data-sort');
    if (currentSort.col === col) {
      currentSort.dir *= -1; // Toggle direction
    } else {
      currentSort.col = col;
      currentSort.dir = -1; // Default to descending when switching columns
    }
    renderTable();
  });
});

// Boot the app
renderStats();
renderFilters();
renderTable();

</script>
</body>
</html>
